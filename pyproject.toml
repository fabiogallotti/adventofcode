[project]
name = "adventofcode"
version = "0.1.0"
description = "Solutions and utilities for Advent of Code puzzles."
readme = "README.md"
authors = [{ name = "Fabio Gallotti", email = "fabio.gallotti.93@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    "graphviz>=0.21",
    "networkx>=3.7.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = ["prek>=0.5.11", "pytest>=9.2.0", "ruff>=0.17.6"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "UP",  # pyupgrade
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
fixable = ["ALL"]
ignore = ["E712", "E741"] # TODO: remove these two ignores
